<h2>Overview</h2>

<p>
Uranus is an ice giant that rotates on its side.
It appears blue due to methane in its atmosphere.
</p>

<h2>Key Facts</h2>

<ul>
<li>Distance from Sun: 2.9 billion km</li>
<li>Diameter: 50,724 km</li>
<li>Year Length: 84 Earth years</li>
<li>Moons: 27</li>
</ul>
